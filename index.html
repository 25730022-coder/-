<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>책방틈</title>
  <link rel="icon" href="asset/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app" id="app">
    <header class="apphead">
      <button type="button" class="icon-btn" id="backBtn" data-action="back" aria-label="뒤로">〈</button>
      <div class="header-brand"><img class="brand-logo" src="asset/bookbangteum-logo.png" alt="책방틈 로고"><strong id="pageTitle">책방틈</strong></div>
      <button type="button" class="icon-btn" data-action="openMenu" aria-label="메뉴">⋯</button>
    </header>

    <!-- 📢 공지사항 및 데이터 기준일 안내 바 -->
    <aside class="notice-bar" aria-label="공지사항">
      <span class="notice-badge">공지</span>
      <span class="notice-text">2026년 기준 서울시 마포구/종로구 독립서점 DB 반영 중</span>
    </aside>

    <main class="screens" id="screens">

      <!-- 01 홈 -->
      <section class="screen" data-screen="home" hidden>
        <h2 class="lead">오늘은 어떤 책방에<br>가보고 싶나요?</h2>
        <form class="search" id="homeSearch" role="search">
          <input type="search" id="homeQuery" placeholder="지역이나 책방 이름 검색" aria-label="지역이나 책방 이름 검색" autocomplete="off">
          <button type="submit" class="search-btn">검색</button>
        </form>
        <div class="tiles">
          <button type="button" class="tile" data-go="list"><b>책방 탐색</b><small>조건으로 찾아보기</small></button>
          <button type="button" class="tile" data-go="course"><b>코스 만들기</b><small>산책 계획하기</small></button>
          <button type="button" class="tile" data-go="my"><b>나의 책방</b><small>즐겨찾기·기록</small></button>
          <button type="button" class="tile" data-go="taste"><b>나의 취향</b><small>추천 조건 설정</small></button>
        </div>
        <h3 class="section">추천 탐색 주제</h3>
        <div class="chips">
          <button type="button" class="chip" data-action="quickTopic" data-key="category" data-value="독립출판">독립출판</button>
          <button type="button" class="chip" data-action="quickTopic" data-key="mood" data-value="조용함">조용한 공간</button>
          <button type="button" class="chip" data-action="quickTopic" data-key="theme" data-value="혼자 가기">혼자 가기</button>
        </div>

        <!-- 📢 데이터 최신성 보완: 제보 유도 버튼 영역 -->
        <div class="report-banner">
          <p>영업시간이 달라졌거나 문을 닫은 책방을 아시나요?</p>
          <button type="button" class="report-open-btn" id="openReportModalBtn" data-action="openReport">서점 정보 제보 / 수정 요청</button>
        </div>
      </section>

      <!-- 02 책방 목록 / 10 결과 없음 -->
      <section class="screen" data-screen="list" hidden>
        <div class="search">
          <input type="search" id="listQuery" placeholder="마포구, 책방 이름 검색" aria-label="책방 검색" autocomplete="off">
        </div>
        <div class="chips" id="filterChips"></div>
        <div class="selected" id="selectedBox"></div>
        <div class="rowline">
          <b id="resultMeta">검색 결과</b>
          <label class="sort">정렬:
            <select id="sortSelect" aria-label="정렬">
              <option value="name">이름순</option>
              <option value="reviews">후기 많은순</option>
            </select>
          </label>
        </div>
        <div id="listBody"></div>
        <button type="button" class="more" id="moreBtn" data-action="loadMore" hidden>목록 더 보기 ↓</button>
      </section>

      <!-- 03 책방 상세 -->
      <section class="screen" data-screen="detail" hidden>
        <div id="detailBody"></div>
      </section>

      <!-- 04 방문자 후기·키워드 -->
      <section class="screen" data-screen="reviews" hidden>
        <div id="reviewBody"></div>
      </section>

      <!-- 05 나의 책방 -->
      <section class="screen" data-screen="my" hidden>
        <div class="tabs" role="tablist">
          <button type="button" role="tab" data-action="myTab" data-tab="fav">즐겨찾기</button>
          <button type="button" role="tab" data-action="myTab" data-tab="visits">방문 기록</button>
          <button type="button" role="tab" data-action="myTab" data-tab="courses">저장 코스</button>
          <button type="button" role="tab" data-action="myTab" data-tab="reports">나의 제보 내역</button>
        </div>
        <div id="myBody"></div>
      </section>

      <!-- 06 코스 조건 설정 -->
      <section class="screen" data-screen="course-setup" hidden>
        <div id="setupBody"></div>
      </section>

      <!-- 07 지도·코스 결과 -->
      <section class="screen" data-screen="map" hidden>
        <div id="mapBody"></div>
      </section>

      <!-- 08 코스 편집·저장 -->
      <section class="screen" data-screen="edit" hidden>
        <div id="editBody"></div>
      </section>

      <!-- 09 나의 취향 -->
      <section class="screen" data-screen="taste" hidden>
        <div id="tasteBody"></div>
      </section>

      <!-- 11 즐겨찾기 저장 완료 -->
      <section class="screen" data-screen="done-fav" hidden>
        <div id="doneFavBody"></div>
      </section>

      <!-- 12 코스 저장 완료 -->
      <section class="screen" data-screen="done-course" hidden>
        <div id="doneCourseBody"></div>
      </section>
    </main>

    <nav class="bottom" aria-label="주요 메뉴">
      <button type="button" data-nav="home">홈</button>
      <button type="button" data-nav="list">책방 탐색</button>
      <button type="button" data-nav="course">코스</button>
      <button type="button" data-nav="my">나의 책방</button>
    </nav>

    <div class="sheet-wrap" id="sheetWrap" hidden>
      <div class="backdrop" data-action="closeSheet"></div>
      <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
        <div class="sheet-head">
          <strong id="sheetTitle"></strong>
          <button type="button" class="icon-btn" data-action="closeSheet" aria-label="닫기">✕</button>
        </div>
        <div class="sheet-body" id="sheetBody"></div>
      </div>
    </div>

    <!-- 📝 사용자 피드백 및 정보 제보 모달 폼 -->
    <div class="modal-wrap" id="reportModal" hidden>
      <div class="backdrop" data-action="closeReport"></div>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reportModalTitle">
        <div class="modal-head">
          <strong id="reportModalTitle">서점 정보 제보 / 수정 요청</strong>
          <button type="button" class="icon-btn" data-action="closeReport" aria-label="닫기">✕</button>
        </div>
        <form class="modal-body" id="reportForm">
          <label class="form-group">
            <span>서점 이름 <mark>*</mark></span>
            <input type="text" id="reportBookstore" placeholder="예: 어쩌다책방" required>
          </label>
          <label class="form-group">
            <span>제보 유형 <mark>*</mark></span>
            <select id="reportType" required>
              <option value="영업시간 변경">영업시간 변경 / 불정기 휴무</option>
              <option value="폐업/휴업">폐업 또는 휴업</option>
              <option value="위치 이장">위치/주소 이동</option>
              <option value="기타">기타 정보 수정 요청</option>
            </select>
          </label>
          <label class="form-group">
            <span>제보 내용 <mark>*</mark></span>
            <textarea id="reportContent" rows="4" placeholder="수정 또는 업데이트가 필요한 구체적인 내용을 작성해 주세요." required></textarea>
          </label>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" data-action="closeReport">취소</button>
            <button type="submit" class="btn-submit">제보하기</button>
          </div>
        </form>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
